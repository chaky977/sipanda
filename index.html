  <title>Sistem Informasi Pembelajaran, Presensi, Nilai dan Data Akademik</title> 

  <style>
    /* Reset total agar tidak memicu scrollbar ganda */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Mengikuti tinggi dinamis layar HP terkini */
      overflow: hidden;
      background-color: #0d1117;
      position: fixed;
      inset: 0;
    }

    /* Iframe dikunci secara absolut di dalam area pandang yang benar-benar tampak */
    iframe {
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Mencegah iframe bablas ke balik bilah tombol navigasi HP */
      display: block;
    }
  </style>
</head>

    src="https://script.google.com/macros/s/AKfycbynfmyPNCgUZhm3VrMrM8DZD033ewLeynQIRgxll_IT_0qkPqhHGkVAQoGS2gQ0e9F-/exec"
